name: small_enterprises
format: parquet
output_file: small_enterprises
include:
  file: smes.yaml
  ref: smes
  ratio: 0.0433
data:
  - name: sme_id
    ref: smes.sme_id
  - name: sme_status
    ref: smes.sme_status
    value: "small"
  - name: employee_count
    type: number
    precision: 0
    range:
      min: 10
      max: 49
  - name: annual_revenue
    type: number
    precision: 0
    range:
      min: 2000000
      max: 10000000
