name: individuals
format: parquet
output_file: individuals
rows: 1000
data:
  - name: full_name
    type: string
    generator: name
  - name: role
    type: string
    generator: profession
  - name: status
    type: string
  - name: email
    type: string
    generator: email
  - name: phone
    type: string
    generator: phone_number