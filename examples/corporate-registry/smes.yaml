name: smes
format: parquet
output_file: smes
include:
  file: organisations.yaml
  ref: organisations
  ratio: 0.99
data:
  - name: sme_id
    type: string
    generator: uuid
  - name: sme_status
    type: string
  - name: org_id
    ref: organisations.org_id
  - name: employee_count
    type: number
    precision: 0
  - name: annual_revenue
    type: number
    precision: 0
    generator: positive_decimal