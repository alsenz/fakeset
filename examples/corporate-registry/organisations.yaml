name: organisations
format: parquet
output_file: organisations
rows: 100
links:
  - file: individuals.yaml
    ref: individual
    ratio: 0.2
    cardinality:
      min: 1
      max: 25
data:
  - name: org_id
    type: string
    generator: uuid
  - name: company_name
    type: string
    generator: company_name
  - name: industry
    type: string
    generator: industry
  - name: bic
    type: string
    generator: bic
  - name: active
    type: boolean
  - name: directors
    type: list
    content:
      from: individual
      fields:
        - name: role
          type: string
          value: "director"
        - name: status
          ref: individual.status
        - name: name
          ref: individual.full_name
        - name: employer
          type: string
          ref: company_name
