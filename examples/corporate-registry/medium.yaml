name: medium_enterprises
format: parquet
output_file: medium_enterprises
include:
  file: smes.yaml
  ref: smes
  ratio: 0.0067
data:
  - name: sme_id
    ref: smes.sme_id
  - name: sme_status
    ref: smes.sme_status
    value: "medium"
  - name: employee_count
    type: number
    precision: 0
    range:
      min: 50
      max: 249
  - name: annual_revenue
    type: number
    precision: 0
    range:
      min: 10000000
      max: 50000000
