name: claims
format: parquet
output_file: claims
include:
  file: contracts.yaml
  ref: contract
  ratio: 0.4
data:
  - name: claim_id
    type: string
    generator: uuid
  - name: contract_id
    ref: contract.contract_id
  - name: customer_id
    ref: contract.customer_id
  # A claim is only ever filed on an active or lapsed contract — never a cancelled one.
  # This restricts the inherited contract `status` variant to a subset (VAR-SPECIALIZE S4b);
  # contracts pins the global status marginal (preserve_marginal) so the cut is compensated.
  - name: contract_status
    ref: contract.status
    one_of: ["active", "lapsed"]
  # Heterogeneous tagged union (VAR-1): each claim type carries its own detail schema.
  # The claim type is recoverable from which sub-struct is populated — no separate
  # claim_type column needed. Generated as an Arrow DenseUnion; written as a
  # nullable-superset struct (one populated case per row).
  - name: claim_detail
    type: variant
    variants:
      - name: property_damage
        type: object
        ratio: 0.3
        fields:
          - name: property_address
            type: string
            generator: street_name
          - name: postcode
            type: string
            generator: zip_code
      - name: theft
        type: object
        ratio: 0.2
        fields:
          - name: stolen_item
            type: string
            generator: word
          - name: police_reference
            type: string
            generator: uuid
      - name: liability
        type: object
        ratio: 0.2
        fields:
          - name: third_party
            type: string
            generator: name
          - name: summary
            type: string
            generator: sentence
      - name: medical
        type: object
        ratio: 0.2
        fields:
          - name: provider
            type: string
            generator: company_name
          - name: diagnosis_code
            type: string
            generator: uuid
      - name: accident          # no ratio → remainder (0.1)
        type: object
        fields:
          - name: location
            type: string
            generator: city_name
          - name: vehicle_involved
            type: boolean
  - name: incident_date
    type: date
    generator: date
  - name: filed_date
    type: date
    generator: date
  - name: claim_amount
    type: number
    precision: 2
    range:
      min: 100.00
      max: 500000.00
  - name: deductible
    type: number
    precision: 2
    range:
      min: 0.00
      max: 5000.00
  - name: net_payout
    expression: "claim_amount - deductible"
  - name: status
    type: variant
    variants:
      - value: "pending"
        ratio: 0.2
      - value: "under_review"
        ratio: 0.25
      - value: "approved"
        ratio: 0.3
      - value: "rejected"
        ratio: 0.15
      - value: "paid"
        ratio: 0.1
