name: flatten_collision_parquet
format: parquet
output_file: flatten_collision_parquet
rows: 10
data:
  - name: detail
    type: variant
    flatten: true
    variants:
      - name: property_damage
        type: object
        ratio: 0.5
        fields:
          - name: amount
            type: number
            range: { min: 1, max: 10 }
      - name: theft
        type: object
        ratio: 0.5
        fields:
          - name: amount
            type: number
            range: { min: 1, max: 10 }
