name: main
format: jsonl
rows: 3
links:
  - file: source.yaml
    ref: src
data:
  - name: items
    type: list
    content:
      from: src
      fields:
        - name: v
          ref: src.val
        # A content `expression` is allowed (EXPR-RELOCATE PR4) but is the sole value-source:
        # combining it with `type` must error.
        - name: doubled
          type: number
          expression: "v * 2"
