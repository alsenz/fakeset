name: events
format: jsonl
output_file: events
rows: 15
links:
  - file: people.yaml
    ref: person
    ratio: 1.0
    cardinality: { min: 1, max: 3 }
data:
  - { name: event_id, type: string, generator: uuid }
  - name: attendees
    type: list
    content:
      from: person
      fields:
        - { name: name, ref: person.full_name }
        - { name: tier, ref: person.tier }
