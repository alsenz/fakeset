name: member
format: csv
output_file: member
include: { file: parent.yaml, ref: p, ratio: 1.0 }
data:
  - { name: id, ref: p.id }
  # Case 3: no conflicting sibling, so both cases survive ~50/50.
  - name: category
    ref: p.category
    variants:
      - { value: "premium", ratio: 0.5 }
      - { value: "basic", ratio: 0.5 }
