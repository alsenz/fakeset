name: scores
format: jsonl
output_file: scores
rows: 30
data:
  - name: base
    type: number
    range: { min: 1, max: 9 }
    precision: 0
  - name: weight
    type: number
    range: { min: 1, max: 5 }
    precision: 0
  # Declared range comfortably contains the expression's derived interval [1, 45].
  - name: score
    type: number
    range: { min: 0, max: 100 }
