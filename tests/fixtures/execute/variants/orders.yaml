name: orders
format: csv
output_file: orders
rows: 100
data:
  - name: id
    type: string
    generator: uuid
  - name: amount
    type: number
    range:
      min: 10
      max: 1000
  # Whole-row variation is now a field variant (top-level `variants:` retired — VAR-UNIFY U4).
  - name: status
    type: variant
    variants:
      - { value: pending, distribution: 0.6 }
      - { value: shipped, distribution: 0.3 }
      - { value: cancelled, distribution: 0.1 }
