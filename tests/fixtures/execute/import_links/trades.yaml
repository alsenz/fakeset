name: trades
format: jsonl
output_file: trades
rows: 30
links:
  - file: tickers.yaml
    ref: tickers
    cardinality:
      min: 1
      max: 3
data:
  - name: trade_id
    type: string
    generator: uuid
  - name: price
    type: number
    range:
      min: 1.0
      max: 1000.0
  - name: instruments
    type: list
    content:
      from: tickers
      fields:
        - name: symbol
          ref: tickers.symbol
        - name: ticker_name
          ref: tickers.name
