name: scores
format: jsonl
output_file: scores
rows: 10
data:
  - name: base
    type: number
    range: { min: 1, max: 9 }
    precision: 0
  - name: weight
    type: number
    range: { min: 1, max: 5 }
    precision: 0
  # Declared as a string, but the child authors it with a numeric expression — a genuine
  # type mismatch that PR2b's static inference must reject up front.
  - name: score
    type: string
