name: person
format: jsonl
output_file: person
rows: 5
data:
  - name: id
    type: string
    generator: uuid
  - name: tags
    type: list
    count:
      min: 1
      max: 3
    content:
      name: item
      type: string
      generator: word
  - name: scores
    type: list
    count: 2
    content:
      name: item
      type: number
      range:
        min: 0.0
        max: 10.0
