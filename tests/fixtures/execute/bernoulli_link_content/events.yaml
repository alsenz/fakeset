name: events
format: jsonl
output_file: events
rows: 10
links:
  - file: items.yaml
    ref: item
    ratio: 0.5
    cardinality:
      min: 1
      max: 3
data:
  - name: title
    type: string
    generator: sentence
  - name: picks
    type: list
    content:
      from: item
      fields:
        - name: item_label
          ref: item.label
        - name: item_value
          ref: item.value
