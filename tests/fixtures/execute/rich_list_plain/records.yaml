name: records
format: jsonl
rows: 5
data:
  - name: record_id
    type: string
    generator: uuid
  - name: entries
    type: list
    count:
      min: 1
      max: 4
    content:
      includes:
        - file: pool.yaml
          ref: entry
          distribution: 0.8
      fields:
        - name: tag
          ref: entry.tag
        - name: badge
          type: string
          generator: word
        - name: score
          type: number
          range:
            min: 0
            max: 10
