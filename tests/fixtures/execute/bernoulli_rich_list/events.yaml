name: events
format: jsonl
output_file: events
rows: 10
data:
  - name: title
    type: string
    generator: sentence
  - name: picks
    type: list
    count:
      min: 1
      max: 3
    content:
      includes:
        - file: items.yaml
          ref: item
          distribution: 0.5
      fields:
        - name: item_label
          ref: item.label
        - name: item_value
          ref: item.value
