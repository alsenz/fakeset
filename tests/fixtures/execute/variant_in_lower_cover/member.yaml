name: member
format: csv
output_file: member
include:
  file: parent.yaml
  ref: p
  ratio: 0.6
data:
  - name: id
    ref: p.id
variants:
  - ratio: 0.5
    data:
      - name: code
        type: string
        value: "alpha"
  - ratio: 0.5
    data:
      - name: code
        type: string
        value: "beta"
