name: member
format: csv
output_file: member
include:
  file: parent.yaml
  ref: p
  ratio: 0.6
data:
  - name: id
    ref: p.id
  # A fresh (non-ref) field variant on a lower-cover member — lowered via VAR-EXPAND.
  - name: code
    type: variant
    variants:
      - { value: "alpha", ratio: 0.5 }
      - { value: "beta", ratio: 0.5 }
