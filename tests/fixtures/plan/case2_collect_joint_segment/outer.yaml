name: outer
format: csv
rows: 3
links:
  - file: pool.yaml
    ref: pool
    cardinality: 2
data:
  - name: label
    type: string
    generator: name
  - name: items
    type: list
    content:
      from: pool
      fields:
        - name: tag
          refs:
            - pool.pool_name
            - bind: pool.tags
              reducer: collect
